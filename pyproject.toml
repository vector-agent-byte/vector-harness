[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vector_harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
vector-harness = "vector_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
